<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Autenticação{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/PLACEHOLDER-FAVICON.png') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="auth">
  <main class="auth__main">
    <div class="auth__card">
      <div class="auth__brand">
        <img src="{{ url_for('static', filename='img/PLACEHOLDER-LOGO.png') }}" alt="Empresa Exemplo casa &amp; construção" width="240" height="35">
        <span>Portal de obras</span>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-container">
            {% for category, message in messages %}
              <div class="flash flash--{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
