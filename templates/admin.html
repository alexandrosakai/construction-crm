<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | Empresa Exemplo</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/PLACEHOLDER-FAVICON.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
        }
        
        .nav-link {
            color: var(--text);
            padding: 0.5rem 1rem;
        }
        
        .nav-link:hover {
            background-color: #495057;
            color: var(--text);
        }
        
        .nav-link.active {
            background-color: #0d6efd;
        }
        
        .content {
            padding: 20px;
        }
        
        .table-actions {
            white-space: nowrap;
        }
        
        .btn-action {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 px-0 sidebar">
                <div class="py-3 px-3 text-center">
                    <img src="images/PLACEHOLDER-IMAGE.png" alt="Empresa Exemplo" class="img-fluid mb-3" 
                         style="max-width: 150px;">
                    <a href="index.html" class="btn btn-outline-light btn-sm w-100">
                        <i class="fas fa-home"></i> Página Inicial
                    </a>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="#" data-section="obras">
                        <i class="fas fa-building"></i> Obras
                    </a>
                    <a class="nav-link" href="#" data-section="profissionais">
                        <i class="fas fa-hard-hat"></i> Profissionais
                    </a>
                    <a class="nav-link" href="#" data-section="vendedores">
                        <i class="fas fa-user-tie"></i> Vendedores
                    </a>
                    <a class="nav-link" href="#" data-section="empresas">
                        <i class="fas fa-building"></i> Empresas
                    </a>
                    <a class="nav-link" href="#" data-section="materiais">
                        <i class="fas fa-tools"></i> Materiais
                    </a>
                    <a class="nav-link" href="#" data-section="fornecedores">
                        <i class="fas fa-truck"></i> Fornecedores
                    </a>
                </nav>
            </div>

            <!-- Conteúdo Principal -->
            <div class="col-md-10">
                <div class="content">
                    <!-- Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 id="sectionTitle">Obras</h2>
                        <button class="btn btn-primary" id="btnAdd">
                            <i class="fas fa-plus"></i> Adicionar
                        </button>
                    </div>

                    <!-- Barra de Pesquisa -->
                    <div class="input-group mb-4">
                        <input type="text" class="form-control" id="searchInput" placeholder="Pesquisar...">
                        <button class="btn btn-outline-secondary" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>

                    <!-- Tabela de Dados -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr id="tableHeader">
                                    <!-- Cabeçalhos serão inseridos dinamicamente -->
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Dados serão inseridos dinamicamente -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Paginação -->
                    <nav>
                        <ul class="pagination justify-content-center">
                            <li class="page-item disabled">
                                <a class="page-link" href="#" tabindex="-1">Anterior</a>
                            </li>
                            <li class="page-item active"><a class="page-link" href="#">1</a></li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item"><a class="page-link" href="#">3</a></li>
                            <li class="page-item">
                                <a class="page-link" href="#">Próximo</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Formulário -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Adicionar Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="itemForm">
                        <!-- Campos do formulário serão inseridos dinamicamente -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSave">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir este item?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
